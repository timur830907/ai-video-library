<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Библиотека & Генератор Книг</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 700px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"], select, button { padding: 12px; border-radius: 6px; border: none; font-size: 16px; }
        input[type="text"] { flex: 1; background: #2a2a2a; color: #fff; }
        select { background: #2a2a2a; color: #fff; width: 100%; margin-bottom: 15px; }
        button { background: #d32f2f; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #b71c1c; }
        .pdf-btn { display: inline-block; background: #0288d1; color: #fff; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        .pdf-btn:hover { background: #0277bd; }
        .result-box { background: #282828; padding: 20px; border-radius: 8px; margin-top: 15px; display: none; text-align: left; }
        .text-container { max-height: 400px; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px; text-align: left; }
        audio { width: 100%; margin-top: 10px; border-radius: 6px; }
        .loading { display: none; color: #ffca28; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card">
    <h1>📖 ИИ Библиотека & Генератор Книг</h1>
    <p class="subtitle">Ищите книги по названию/автору или генерируйте по жанру:</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Введите название книги или автора...">
        <button onclick="processRequest('search')">Найти книгу</button>
    </div>

    <div style="text-align: center; color: #777; margin-bottom: 15px;">— ИЛИ —</div>

    <select id="genreSelect">
        <option value="Фантастика (RU)">Фантастика (RU)</option>
        <option value="Комедия (RU)">Комедия (RU)</option>
        <option value="Боевик (RU)">Боевик (RU)</option>
        <option value="Триллер (RU)">Триллер (RU)</option>
        <option value="История (RU)">История (RU)</option>
        <option value="Наука (RU)">Наука (RU)</option>
        <option value="Sci-Fi (EN)">Sci-Fi (EN)</option>
        <option value="Detective (EN)">Detective (EN)</option>
        <option value="Horror (EN)">Horror (EN)</option>
        <option value="Қазақ әдебиеті (KK)">Қазақ әдебиеті (KK)</option>
        <option value="Дала сыры (KK)">Дала сыры (KK)</option>
    </select>
    
    <button onclick="processRequest('genre')" style="width: 100%;">Сгенерировать по жанру</button>

    <div id="loading" class="loading">⏳ Загрузка текста, формирование PDF и генерация озвучки (первый запуск может занять до 30-40 сек)...</div>

    <div id="result" class="result-box">
        <h2 id="bookTitle"></h2>
        <p id="bookAuthor" style="color: #bbb; font-weight: bold;"></p>

        <a id="pdfLink" class="pdf-btn" href="#" target="_blank">📄 Скачать книгу в PDF</a>

        <h4>📖 Полный текст:</h4>
        <div id="bookText" class="text-container"></div>

        <h4>🎧 Аудиоозвучка:</h4>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    const BACKEND_URL = "https://ai-video-library.onrender.com";

    async function processRequest(mode) {
        let query = "";
        if (mode === 'search') {
            query = document.getElementById("searchInput").value.trim();
            if (!query) {
                alert("Пожалуйста, введите название книги или автора.");
                return;
            }
        } else {
            query = document.getElementById("genreSelect").value;
        }

        const loading = document.getElementById("loading");
        const result = document.getElementById("result");

        loading.style.display = "block";
        result.style.display = "none";

        try {
            const response = await fetch(`${BACKEND_URL}/generate`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ user_id: "user1", genre: query })
            });

            if (!response.ok) {
                throw new Error(`Ошибка сервера: ${response.status}`);
            }

            const data = await response.json();

            document.getElementById("bookTitle").innerText = data.book.title;
            document.getElementById("bookAuthor").innerText = "Автор: " + data.book.author;
            document.getElementById("bookText").innerText = data.book.text;

            const pdfBtn = document.getElementById("pdfLink");
            pdfBtn.href = BACKEND_URL + data.pdf_url;

            const audio = document.getElementById("audioPlayer");
            audio.src = BACKEND_URL + data.audio_url;

            loading.style.display = "none";
            result.style.display = "block";
        } catch (e) {
            alert("Сервер поднимается из спящего режима или произошла ошибка: " + e.message + "\nПопробуйте повторить клик через 15-20 секунд.");
            loading.style.display = "none";
        }
    }
</script>

</body>
</html>
