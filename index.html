<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персональная ИИ Библиотека</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 25px; }
        label { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; display: block; margin-top: 15px; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 14px; background: #e50914; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; }
        button:hover { background: #ff1e27; }
        .result-box { margin-top: 30px; padding: 20px; background: #252525; border-radius: 8px; display: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-group a, .btn-group button { flex: 1; text-align: center; text-decoration: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; color: white; background: #007acc; cursor: pointer; border: none; }
        .btn-group .btn-tg { background: #0088cc; }
        .btn-group .btn-copy { background: #444; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Персональная ИИ Библиотека</h1>
        <p class="subtitle">Создавайте уникальные аудиокниги со своим именем или делитесь ими с друзьями</p>

        <label>👤 ПЕРСОНАЛИЗАЦИЯ ГЛАВНОГО ГЕРОЯ:</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="heroInput" placeholder="Имя героя (напр. Тимур)">
            <input type="text" id="themeInput" placeholder="Эпоха / Сеттинг">
        </div>

        <label>🔍 ПОИСК КНИГИ ИЛИ ЖАНР:</label>
        <input type="text" id="searchInput" placeholder="Введите название реальной книги или автора...">
        
        <select id="genreSelect">
            <option value="">или выберите жанр из списка</option>
            <option value="Фантастика (RU)">Фантастика (RU)</option>
            <option value="Детектив (RU)">Детектив (RU)</option>
            <option value="Ужасы (RU)">Ужасы (RU)</option>
            <option value="Sci-Fi (EN)">Sci-Fi (EN)</option>
            <option value="Қазақ әдебиеті (KK)">Қазақ әдебиеті (KK)</option>
        </select>

        <button onclick="generateBook()" id="genBtn">✨ Найти / Сгенерировать аудиокнигу</button>

        <div class="result-box" id="resultBox">
            <h2 id="bookTitle"></h2>
            <p id="bookAuthor" style="color: #4caf50; font-weight: bold;"></p>
            <audio id="audioPlayer" controls></audio>
            <div class="btn-group">
                <a id="pdfLink" target="_blank">📥 Скачать PDF</a>
                <button class="btn-tg" onclick="shareTelegram()">✈️ В Telegram</button>
                <button class="btn-copy" onclick="copyLink()">📋 Скопировать ссылку</button>
            </div>
            <h4 style="margin-top: 20px;">📜 Текст книги:</h4>
            <p id="bookText" style="line-height: 1.6; color: #ddd;"></p>
        </div>
    </div>

    <script>
        const API_BASE = "https://ai-video-library.onrender.com"; // или адрес вашего бэкенда на Render

        async function generateBook() {
            const hero = document.getElementById('heroInput').value.trim();
            const theme = document.getElementById('themeInput').value.trim();
            const searchVal = document.getElementById('searchInput').value.trim();
            const genreVal = document.getElementById('genreSelect').value;

            // Если введено название в поле поиска — ищем его, иначе берем жанр из селекта
            const query = searchVal ? searchVal : genreVal;

            if (!query) {
                alert("Пожалуйста, введите название книги или выберите жанр!");
                return;
            }

            const btn = document.getElementById('genBtn');
            btn.innerText = "⏳ Поиск книги и генерация...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        genre: query,
                        hero_name: hero,
                        theme_setting: theme
                    })
                });

                const data = await res.json();

                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('bookTitle').innerText = data.book.title;
                document.getElementById('bookAuthor').innerText = "Автор: " + data.book.author;
                document.getElementById('bookText').innerText = data.book.text;
                document.getElementById('audioPlayer').src = API_BASE + data.audio_url;
                document.getElementById('pdfLink').href = API_BASE + data.pdf_url;

            } catch (err) {
                alert("Ошибка генерации. Проверьте подключение к серверу.");
                console.error(err);
            } finally {
                btn.innerText = "✨ Найти / Сгенерировать аудиокнигу";
                btn.disabled = false;
            }
        }

        function shareTelegram() {
            const title = document.getElementById('bookTitle').innerText;
            const url = window.location.href;
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`);
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Ссылка скопирована!");
        }
    </script>
</body>
</html>
