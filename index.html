<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Генератор Книг</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 600px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p.subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none; font-size: 16px; }
        select { background: #2a2a2a; color: #fff; }
        button { background: #d32f2f; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #b71c1c; }
        .result-box { background: #282828; padding: 20px; border-radius: 8px; margin-top: 15px; display: none; }
        audio, video { width: 100%; margin-top: 10px; border-radius: 6px; }
        .loading { display: none; color: #ffca28; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card">
    <h1>📖 ИИ Генератор Книг</h1>
    <p class="subtitle">Выберите жанр для создания аудиофрагмента и видеоряда:</p>

    <select id="genreSelect">
        <option value="Фантастика">Фантастика (RU)</option>
        <option value="Комедия">Комедия (RU)</option>
        <option value="Боевик">Боевик (RU)</option>
        <option value="Триллер">Триллер (RU)</option>
        <option value="История">История (RU)</option>
        <option value="Наука">Наука (RU)</option>
        <option value="Sci-Fi">Sci-Fi (EN)</option>
        <option value="Detective">Detective (EN)</option>
        <option value="Horror">Horror (EN)</option>
        <option value="Қазақ әдебиеті">Қазақ әдебиеті (KK)</option>
        <option value="Дала сыры">Дала сыры (KK)</option>
    </select>

    <button onclick="generateContent()">Сгенерировать контент</button>

    <div id="loading" class="loading">⏳ Идет поиск книги и генерация нейроозвучки...</div>

    <div id="result" class="result-box">
        <h2 id="bookTitle"></h2>
        <p id="bookAuthor" style="color: #bbb; font-weight: bold;"></p>
        <p id="bookText" style="line-height: 1.6;"></p>

        <h4>🎧 Озвучка:</h4>
        <audio id="audioPlayer" controls></audio>

        <h4>🎬 Видеоряд:</h4>
        <video id="videoPlayer" controls autoplay loop muted></video>
    </div>
</div>

<script>
    // Замените URL на ваш адрес сервиса на Render при необходимости
    const BACKEND_URL = "https://ai-video-library.onrender.com";

    async function generateContent() {
        const genre = document.getElementById("genreSelect").value;
        const loading = document.getElementById("loading");
        const result = document.getElementById("result");

        loading.style.display = "block";
        result.style.display = "none";

        try {
            const response = await fetch(`${BACKEND_URL}/generate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: "user1", genre: genre })
            });

            const data = await response.json();

            document.getElementById("bookTitle").innerText = data.book.title;
            document.getElementById("bookAuthor").innerText = "Автор: " + data.book.author;
            document.getElementById("bookText").innerText = data.book.text;

            const audio = document.getElementById("audioPlayer");
            audio.src = BACKEND_URL + data.audio_url;

            const video = document.getElementById("videoPlayer");
            video.src = data.video_url;

            loading.style.display = "none";
            result.style.display = "block";
        } catch (e) {
            alert("Ошибка связи с бэкендом: " + e.message);
            loading.style.display = "none";
        }
    }
</script>

</body>
</html>
