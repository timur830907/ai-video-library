<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Аудио & Видео Библиотека</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; }
        .card { background: #1e1e1e; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        select, button { padding: 12px 20px; font-size: 16px; margin: 10px; border-radius: 6px; border: none; }
        select { background: #2a2a2a; color: #fff; }
        button { background: #e50914; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #b80710; }
        #result { background: #282828; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎬 ИИ Генератор Книг</h1>
    <p>Выберите жанр для создания аудиофрагмента и видеоряда:</p>
    
    <select id="genreSelect">
        <option value="Фантастика">🚀 Фантастика</option>
        <option value="Детектив">🔍 Детектив</option>
        <option value="Фэнтези">🐉 Фэнтези</option>
        <option value="Киберпанк">🤖 Киберпанк</option>
    </select>
    <br>
    <button onclick="generateMedia()">Сгенерировать и озвучить</button>

    <div id="status" style="margin-top: 15px; color: #ffb703;"></div>

    <div id="result" style="display:none;">
        <h2 id="title" style="color: #e50914; margin-top: 0;"></h2>
        <h4 id="author" style="color: #aaa;"></h4>
        <p id="text" style="line-height: 1.6;"></p>
        <label>🎙 Аудиодорожка:</label>
        <audio id="audioPlayer" controls></audio>
        <label style="display:block; margin-top:15px;">📹 Видеоряд:</label>
        <video id="videoPlayer" controls></video>
    </div>
</div>

<script>
async function generateMedia() {
    const genre = document.getElementById('genreSelect').value;
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    
    statusDiv.innerText = "⏳ ИИ генерирует текст, аудио и видео...";
    resultDiv.style.display = 'none';

    try {
        const response = await fetch('/api/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: 'test_user', genre: genre })
        });

        if (response.status === 402) {
            alert("Бесплатный период (30 дней) завершен. Оплатите подписку через Kaspi QR!");
            statusDiv.innerText = "";
            return;
        }

        const data = await response.json();
        statusDiv.innerText = "";
        resultDiv.style.display = 'block';

        document.getElementById('title').innerText = data.book.title;
        document.getElementById('author').innerText = "Автор: " + data.book.author;
        document.getElementById('text').innerText = data.book.text;
        
        document.getElementById('audioPlayer').src = data.audio_url;
        document.getElementById('videoPlayer').src = data.video_url;
    } catch (err) {
        statusDiv.innerText = "❌ Ошибка при отправке запроса.";
        console.error(err);
    }
}
</script>

</body>
</html>
